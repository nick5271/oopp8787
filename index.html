<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暮日防線 · 殭屍放置遊戲</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><p class="eyebrow">DEADLIGHT / IDLE SURVIVAL</p><h1>暮日防線<span>最後一道光，永不熄滅。</span></h1></div><div class="status"><i></i> 自動戰鬥中</div></header>
<section class="metrics"><div><small>生存波次</small><strong id="wave">01</strong></div><div><small>補給金幣</small><strong id="coins">0</strong></div><div><small>累積擊殺</small><strong id="kills">0</strong></div><div><small>每秒傷害</small><strong id="dps">0</strong></div></section>
<section class="battle"><div class="battle-top"><span>◈ 第七避難所 / 東側防線</span><span id="progress">波次進度 0 / 8</span></div><canvas id="game" width="1200" height="460" aria-label="倖存者自動射擊由右側來襲的殭屍"></canvas><div class="battle-bottom"><div><span>防線完整度</span><div class="health-track"><div id="health-bar"></div></div><small id="health">100 / 100</small></div><button id="skill">空中支援 <span id="cooldown">準備就緒</span></button></div></section>
<section class="lower"><div class="upgrades"><div class="section-title"><h2>強化避難所</h2><span>投資補給，撐過下一個夜晚</span></div><div class="upgrade-grid"><button data-upgrade="power"><span class="icon">⌖</span><strong>武器傷害</strong><small id="power-detail"></small><em id="power-cost"></em></button><button data-upgrade="speed"><span class="icon">ϟ</span><strong>射擊速度</strong><small id="speed-detail"></small><em id="speed-cost"></em></button><button data-upgrade="wall"><span class="icon">▥</span><strong>防線裝甲</strong><small id="wall-detail"></small><em id="wall-cost"></em></button></div></div><aside><h2>倖存者日誌</h2><p id="message" role="status">殭屍正在接近。守住防線，收集補給。</p><p class="hint">自動射擊 · 金幣升級 · 點擊空中支援清場<br>進度自動保存，離線補給最多累積 8 小時。</p><button id="reset" class="quiet">重新開始</button></aside></section><footer>保持火力。保持希望。 <span>本機存檔 / 無需帳號</span></footer></main><script src="game.js"></script></body></html>
